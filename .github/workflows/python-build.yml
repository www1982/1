# GitHub Actions workflow for building the Python script with PyInstaller

name: Build Python Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyInstaller
        run: pyinstaller --onefile --noconsole projects/modtest/1.py

      - name: Determine Artifact Info
        id: artifact_info
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "artifact_name=windows-executable" >> $GITHUB_ENV
            echo "artifact_path=dist/1.exe" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "artifact_name=macos-executable" >> $GITHUB_ENV
            echo "artifact_path=dist/1" >> $GITHUB_ENV
          else
            echo "artifact_name=linux-executable" >> $GITHUB_ENV
            echo "artifact_path=dist/1" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_path }}
